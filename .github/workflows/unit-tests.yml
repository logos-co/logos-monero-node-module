name: monero_node_module Unit Tests

# The proxy chokepoint and config store, run on every change. `--no-default-features` drops the
# logos_module glue (and the logos-rust-sdk path dep), so this is plain cargo — no nix, no SDK
# build, no network beyond crates.io. nix's own fetcher 403s crates.io; plain cargo does not.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (pure core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: Provide the SDK manifest cargo insists on resolving
        # --no-default-features never COMPILES the SDK, but cargo still resolves the manifest of
        # the optional path dep, and logos-rust-sdk-src is gitignored (the nix builder stages it).
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-rust-sdk
          path: logos-rust-sdk-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-lib

      - name: cargo test --no-default-features
        run: cargo test --manifest-path rust-lib/Cargo.toml --no-default-features --locked

      - name: The fail-closed and config guards must actually be present
        # A suite that silently stops compiling reads as coverage. Assert the load-bearing
        # tests by name — the fail-closed proxy check above all.
        run: |
          out=$(cargo test --manifest-path rust-lib/Cargo.toml --no-default-features --locked -- --list)
          echo "$out"
          for t in proxy_required_without_proxy_fails_closed \
                   init_defaults_does_not_clobber_an_external_endpoint \
                   unknown_network_is_refused \
                   a_schemeless_url_gets_a_scheme_before_it_is_stored \
                   fail_closed_when_required_and_unset \
                   each_mode_routes_the_wallet_where_it_says \
                   onion_and_own_network_keep_their_route_in_every_mode \
                   settings_are_locked_while_a_wallet_is_open \
                   a_node_you_set_is_never_probed_or_moved \
                   with_a_wallet_open_only_the_onion_half_moves_and_never_to_the_catch_up_operator \
                   all_never_dials_a_direct_node_and_none_never_asks_for_tor \
                   your_own_node_is_routed_by_its_address_whatever_use_tor_for_says \
                   your_own_node_is_never_probed_or_moved_even_on_a_listed_address \
                   choosing_the_picked_node_brings_back_the_seed_and_keeps_a_pick \
                   a_pair_whose_direct_half_is_on_your_network_stays_a_pair; do
            echo "$out" | grep -q "$t" || { echo "MISSING guard test: $t"; exit 1; }
          done
