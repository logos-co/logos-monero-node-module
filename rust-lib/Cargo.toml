[package]
name = "monero_node_module"
version = "0.1.0"
edition = "2021"
description = "Logos monero_node_module — proxyable, fail-closed monerod JSON-RPC client (per-network config)."
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Same networking stack as eth_rpc_module: rustls-tls + socks (socks5h, Tor-ready),
# blocking client. Deliberately the identical dep set so the crate versions are already
# in the org nix cache (a fresh version would 403 under nix's fetcher).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "blocking"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

[dev-dependencies]
tempfile = "3"
